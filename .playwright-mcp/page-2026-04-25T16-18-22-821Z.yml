              - heading "Course Description" [level=2] [ref=e167]
              - generic [ref=e168]:
                - article [ref=e169]:
                  - text: Learn to create an interactive dashboard using the shinydashboard package in R. Whether you need to provide a client with information, create a data analysis report, or keep track of the performance of a personal project, shinydashboard can help you create something impactful. Learn the essentials of this powerful package today.
                  - heading "Understand How to Use Dashboards" [level=2] [ref=e171]
                  - text: While reports can provide you with a snapshot of a situation, a dashboard is not only dynamic, meaning that data can be updated in real time but also interactive. This makes for a more immersive experience for your audience.
                  - heading "Learn To Use shinydashboard" [level=2] [ref=e172]
                  - text: In this course, you will learn how to use shinydashboard in R to create a dynamic and interactive dashboard. You will cover the ins and outs of shinydashboard and learn about good UI/UX practices.
                  - heading "Build an Interactive Dashboard" [level=2] [ref=e173]
                  - text: You will first build a shinyApp and then graduate to building a shinydashboard. Then, you learn how to include interactive elements with hover-over effects.
                  - text: Finally, you will explore how to tweak your design elements of a shinydashboard using CSS code and more. You will be given the opportunity to practice these concepts using various datasets in the context of four different scenarios.
                  - text: Upon completing this course, you will be better equipped to create tailor-made dashboards for any purpose using shinydashboard.
                - button "Read More" [ref=e174] [cursor=pointer]:
                  - generic [ref=e175]: Read More
                  - img [ref=e176]
